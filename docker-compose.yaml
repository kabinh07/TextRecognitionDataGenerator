services:
  combined_generator:
    container_name: combined_generator
    image: trdg-test:latest
    build: .
    volumes:
      # Shamadhan NID data (dataset.csv / merged_reviewed_latest.csv / label_mappings.csv)
      - /mnt/truenas/datasets/ocr_dataset_shamadhan:/app/data
      # postal_codes.csv mounted separately to avoid NAS directory collision
      - ./data/postal_codes.csv:/app/postal_codes.csv
      # Output directory on NAS
      # - ./output:/app/output
      - /mnt/truenas/datasets/synth/combined_output:/app/output
      # HF dataset directory
      - /mnt/truenas/datasets/ocr_dataset_shamadhan/hf_dataset:/app/hf_dataset
      # Hot-mount source files so changes don't require image rebuild
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 16g
    cpus: 2
    # Test run: 50 shamadhan/lang + 50 addresses = ~150 images
    # Full run:  --text_count 5000 --address_count 10000
    command: >
      python3 generate_combined.py
        --text_count 10000
        --address_count 10000
        --output_dir /app/output
        --font_size 11
        --blur 0.3
        --csv_path /app/postal_codes.csv
        --shamadhan_dir /app/data
        --hf_dir /app/hf_dataset
        --prepare_hf
        --reset

  confusion_generator:
    container_name: confusion_generator
    image: trdg-test:latest
    build: .
    volumes:
      - /mnt/truenas/datasets/ocr_dataset_shamadhan:/app/data
      - ./data/postal_codes.csv:/app/postal_codes.csv
      - /mnt/truenas/datasets/synth/combined_output:/app/output
      # - ./output:/app/output
      - /mnt/truenas/datasets/ocr_dataset_shamadhan/hf_dataset:/app/hf_dataset
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 8g
    cpus: 2
    # Generates ONLY confusion-pair data (text_count/address_count=0 skips
    # shamadhan+address), then rebuilds the HF dataset.
    # --reset_confusion: only resets confusion plan, shamadhan/addr plans untouched.
    command: >
      python3 generate_combined.py
        --text_count 0
        --address_count 0
        --output_dir /app/output
        --font_size 11
        --blur 0.3
        --csv_path /app/postal_codes.csv
        --shamadhan_dir /app/data
        --hf_dir /app/hf_dataset
        --confusion_count 300
        --reset_confusion
        --prepare_hf
        --reset_hf

  full_pipeline:
    container_name: full_pipeline
    image: trdg-test:latest
    build: .
    volumes:
      # Shamadhan real data (dataset.csv + cropped_images/ + NID JSON corpora)
      - /mnt/truenas/datasets/ocr_dataset_shamadhan:/app/data
      - ./data/postal_codes.csv:/app/postal_codes.csv
      # Freshly generated synthetic images land here
      # - ./output:/app/output
      - /mnt/truenas/datasets/synth_2/full_pipeline_output:/app/output
      # Confusion images (resumable across runs)
      - /mnt/truenas/datasets/synth_2/confusion_work:/app/confusion_work
      # Final extended HF Parquet dataset
      - /mnt/truenas/datasets/synth_2/hf_extended:/app/hf_extended
      # Hot-mount source files
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./build_confusion_dataset.py:/app/build_confusion_dataset.py
      - ./prepare_hf_dataset.py:/app/prepare_hf_dataset.py
      - ./generate_hard_negatives.py:/app/generate_hard_negatives.py
      - ./run_pipeline.sh:/app/run_pipeline.sh
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 10g
    cpus: 8
    environment:
      - HF_TOKEN=${HF_TOKEN}
    # Produces: p2 base + fresh local synth + shamadhan real + confusion → /app/hf_extended/
    # To push result, add to run_pipeline.sh or run:
    #   docker compose run --rm full_pipeline python3 build_confusion_dataset.py ... --push_to_hub org/name
    command: bash /app/run_pipeline.sh

  conjunct_generator:
    container_name: conjunct_generator
    image: trdg-test:latest
    build: .
    volumes:
      - /mnt/truenas/datasets/synth_2/conjunct_output:/app/conjunct_output
      - ./generate_conjunct_dataset.py:/app/generate_conjunct_dataset.py
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 8g
    cpus: 4
    environment:
      - HF_TOKEN=${HF_TOKEN}
    # Run: docker compose run --rm conjunct_generator
    # To push: add --push_to_hub kavinh07/bn-conjunct-ocr
    command: >
      python3 generate_conjunct_dataset.py
        --output_dir /app/conjunct_output
        --total 5000
        --font_size 32
        --blur 0.3
        --shard_size 500

  build_confusion_dataset:
    container_name: build_confusion_dataset
    image: trdg-test:latest
    build: .
    volumes:
      - /mnt/truenas/datasets/synth/confusion_work:/app/confusion_work
      - /mnt/truenas/datasets/synth/hf_extended:/app/hf_extended
      - ./build_confusion_dataset.py:/app/build_confusion_dataset.py
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 16g
    cpus: 2
    environment:
      - HF_TOKEN=${HF_TOKEN}
    # Set HF_TOKEN in your shell before running:
    #   export HF_TOKEN=hf_xxx
    #   docker compose run --rm build_confusion_dataset
    #
    # To push result:  add --push_to_hub kavinh07/ocr_dataset_shamadhan_synth_30k_p3
    # To regenerate:   add --reset
    command: >
      python3 build_confusion_dataset.py
        --source_dataset kavinh07/ocr_dataset_shamadhan_synth_30k_p2
        --confusion_count 300
        --font_size 11
        --blur 0.3
        --work_dir /app/confusion_work
        --output_dir /app/hf_extended
        --shard_size 500

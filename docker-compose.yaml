services:
  combined_generator:
    container_name: combined_generator
    image: trdg-test:latest
    build: .
    volumes:
      # Shamadhan NID data (dataset.csv / merged_reviewed_latest.csv / label_mappings.csv)
      - /mnt/truenas/datasets/ocr_dataset_shamadhan:/app/data
      # postal_codes.csv mounted separately to avoid NAS directory collision
      - ./data/postal_codes.csv:/app/postal_codes.csv
      # Output directory on NAS
      # - ./output:/app/output
      - /mnt/truenas/datasets/synth/combined_output:/app/output
      # HF dataset directory
      - /mnt/truenas/datasets/ocr_dataset_shamadhan/hf_dataset:/app/hf_dataset
      # Hot-mount source files so changes don't require image rebuild
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 16g
    cpus: 2
    # Test run: 50 shamadhan/lang + 50 addresses = ~150 images
    # Full run:  --text_count 5000 --address_count 10000
    command: >
      python3 generate_combined.py
        --text_count 10000
        --address_count 10000
        --output_dir /app/output
        --font_size 11
        --blur 0.3
        --csv_path /app/postal_codes.csv
        --shamadhan_dir /app/data
        --hf_dir /app/hf_dataset
        --prepare_hf
        --reset

  confusion_generator:
    container_name: confusion_generator
    image: trdg-test:latest
    build: .
    volumes:
      - /mnt/truenas/datasets/ocr_dataset_shamadhan:/app/data
      - ./data/postal_codes.csv:/app/postal_codes.csv
      - /mnt/truenas/datasets/synth/combined_output:/app/output
      # - ./output:/app/output
      - /mnt/truenas/datasets/ocr_dataset_shamadhan/hf_dataset:/app/hf_dataset
      - ./generate_combined.py:/app/generate_combined.py
      - ./address_generator.py:/app/address_generator.py
      - ./trdg/fonts:/app/trdg/fonts
    mem_limit: 8g
    cpus: 2
    # Generates ONLY confusion-pair data (text_count/address_count=0 skips
    # shamadhan+address), then rebuilds the HF dataset.
    # --reset_confusion: only resets confusion plan, shamadhan/addr plans untouched.
    command: >
      python3 generate_combined.py
        --text_count 0
        --address_count 0
        --output_dir /app/output
        --font_size 11
        --blur 0.3
        --csv_path /app/postal_codes.csv
        --shamadhan_dir /app/data
        --hf_dir /app/hf_dataset
        --confusion_count 300
        --reset_confusion
        --prepare_hf
        --reset_hf
